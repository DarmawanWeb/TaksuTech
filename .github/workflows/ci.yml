name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  commitlint:
    name: Conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  check:
    name: Biome, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      # The web app and the simulator are submodules: the workspace is incomplete without them.
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm biome ci .
      - run: pnpm turbo run typecheck test
      - run: pnpm turbo run build

  validate:
    name: Compose, Caddy, shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cp infra/.env.example infra/.env
      - run: docker compose --env-file infra/.env config --quiet
      - name: Caddyfile
        run: >-
          docker run --rm -v "$PWD/infra/caddy:/etc/caddy:ro"
          -e WEB_HOST=robots.example.com -e SIM_HOST=sim.example.com
          caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - run: shellcheck -x infra/deploy.sh infra/scripts/*.sh
