name: Deploy to Mac mini

# Runs on the self-hosted runner on the Mac mini after CI passes on main.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-macmini
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          submodules: true

      # Compose bind-mounts config files, so deploy from the same folder the stack already
      # runs from (~/web/taksu-tech), not the runner workspace. Its .git and env stay put.
      - name: Sync to ~/web/taksu-tech
        run: |
          mkdir -p "$HOME/web/taksu-tech"
          rsync -a --delete --exclude .git --exclude node_modules --exclude '.next' --exclude '.turbo' \
            --exclude 'infra/.env' ./ "$HOME/web/taksu-tech/"

      - name: Deploy with Docker Compose
        run: ENV_FILE="$HOME/web/taksu-tech.env" "$HOME/web/taksu-tech/infra/deploy.sh"
