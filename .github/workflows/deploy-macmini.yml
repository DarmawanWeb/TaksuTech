name: Deploy to Mac mini

# Runs on the self-hosted runner on the Mac mini after CI passes on main.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-macmini
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 60
    env:
      APP_DIR: ${{ format('{0}/apps/taksu-tech', '~') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # Compose bind-mounts config files, so deploy from a stable folder, not the runner workspace.
      - name: Sync to ~/apps/taksu-tech/app
        run: |
          mkdir -p "$HOME/apps/taksu-tech/app"
          rsync -a --delete --exclude .git --exclude node_modules --exclude '.next' --exclude '.turbo' \
            --exclude 'infra/.env' ./ "$HOME/apps/taksu-tech/app/"

      - name: Deploy with Docker Compose
        working-directory: ${{ env.HOME }}
        run: ENV_FILE="$HOME/apps/taksu-tech/.env" "$HOME/apps/taksu-tech/app/infra/deploy.sh"
