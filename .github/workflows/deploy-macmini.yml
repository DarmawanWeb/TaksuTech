name: Deploy (Mac mini)

# Runs on the organisation's self-hosted runner on the Mac mini after CI passes on main.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-macmini
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    environment: production
    env:
      TAKSU_HOME: ${{ vars.TAKSU_HOME }}
      # Keeps a PM2 daemon started by this job alive after the job finishes.
      RUNNER_TRACKING_ID: ''
      GITHUB_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Sync source to the server folder
        run: |
          target="${TAKSU_HOME:-$HOME/apps/taksu-tech}/source"
          mkdir -p "$target"
          rsync -a --delete --exclude .git --exclude node_modules --exclude .next --exclude .turbo ./ "$target/"

      - name: Build, release, and reload PM2
        run: '"${TAKSU_HOME:-$HOME/apps/taksu-tech}/source/deploy/macmini/deploy.sh"'
