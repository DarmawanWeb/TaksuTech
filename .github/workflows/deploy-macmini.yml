name: Deploy to Mac mini

# Runs on a self-hosted runner on the Mac mini. Manual for now: once a runner is registered for
# this repository, add a workflow_run trigger on CI (as in TaksuTech) to deploy every green main.
on:
  workflow_dispatch:

concurrency:
  group: deploy-macmini-education-robot
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      # Compose bind-mounts the Caddyfile, so deploy from the folder the stack already runs
      # from (~/web/education-robot), not the runner workspace. Its .git and env stay put.
      - name: Sync to ~/web/education-robot
        run: |
          mkdir -p "$HOME/web/education-robot"
          rsync -a --delete --exclude .git --exclude node_modules --exclude '.next' --exclude '.turbo' \
            --exclude 'infra/.env' ./ "$HOME/web/education-robot/"

      - name: Deploy with Docker Compose
        run: ENV_FILE="$HOME/web/education-robot.env" "$HOME/web/education-robot/infra/deploy.sh"
