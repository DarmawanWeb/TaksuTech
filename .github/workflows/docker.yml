name: Docker images

# Continuous delivery: every push to main (and every v* tag) publishes one image per app to
# GHCR, named after the app's repository. Set repository variables COMPANY_URL, EDU_URL,
# ROBOT_URL, KIOSK_URL, SIM_URL, and WHATSAPP_NUMBER first. The education robots publish theirs
# from education-robot.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: web, image: company-profile }
          - { app: robot, image: reception-robot-web }
          - { app: kiosk, image: reception-robot-kiosk }
    steps:
      # The apps are submodules; the image needs the app it builds and the shared packages.
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP=${{ matrix.app }}
            NEXT_PUBLIC_COMPANY_URL=${{ vars.COMPANY_URL }}
            NEXT_PUBLIC_EDU_URL=${{ vars.EDU_URL }}
            NEXT_PUBLIC_ROBOT_URL=${{ vars.ROBOT_URL }}
            NEXT_PUBLIC_KIOSK_URL=${{ vars.KIOSK_URL }}
            NEXT_PUBLIC_SIM_URL=${{ vars.SIM_URL }}
            NEXT_PUBLIC_WHATSAPP_NUMBER=${{ vars.WHATSAPP_NUMBER }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
