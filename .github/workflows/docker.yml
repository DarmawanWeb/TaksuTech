name: Docker images

# Continuous delivery: every push to main (and every v* tag) publishes one image per app to
# GHCR. Set repository variables COMPANY_URL, EDU_URL, ROBOT_URL, KIOSK_URL, SIM_URL, and
# WHATSAPP_NUMBER first.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [web, edu, robot, kiosk, sim]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/taksu-${{ matrix.app }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP=${{ matrix.app }}
            NEXT_PUBLIC_COMPANY_URL=${{ vars.COMPANY_URL }}
            NEXT_PUBLIC_EDU_URL=${{ vars.EDU_URL }}
            NEXT_PUBLIC_ROBOT_URL=${{ vars.ROBOT_URL }}
            NEXT_PUBLIC_KIOSK_URL=${{ vars.KIOSK_URL }}
            NEXT_PUBLIC_SIM_URL=${{ vars.SIM_URL }}
            NEXT_PUBLIC_WHATSAPP_NUMBER=${{ vars.WHATSAPP_NUMBER }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
