name: Docker images

# Every push to main (and every v* tag) publishes one image per app to GHCR. Set the repository
# variables WEB_URL, SIM_URL, WHATSAPP_NUMBER, CONTACT_EMAIL, TOKOPEDIA_URL, and SHOPEE_URL first:
# they are inlined into the pages at build time.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [web, sim]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ulik-${{ matrix.app }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP=${{ matrix.app }}
            NEXT_PUBLIC_WEB_URL=${{ vars.WEB_URL }}
            NEXT_PUBLIC_SIM_URL=${{ vars.SIM_URL }}
            NEXT_PUBLIC_WHATSAPP_NUMBER=${{ vars.WHATSAPP_NUMBER }}
            NEXT_PUBLIC_EMAIL=${{ vars.CONTACT_EMAIL }}
            NEXT_PUBLIC_TOKOPEDIA_URL=${{ vars.TOKOPEDIA_URL }}
            NEXT_PUBLIC_SHOPEE_URL=${{ vars.SHOPEE_URL }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
