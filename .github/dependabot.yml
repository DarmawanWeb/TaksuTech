version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      next-react:
        patterns: ['next', 'react', 'react-dom', '@types/react*', 'next-intl']
      tooling:
        patterns: ['@biomejs/biome', 'typescript*', 'vitest', 'vite', 'turbo', '@commitlint/*']
    commit-message:
      prefix: 'chore'
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'ci'
  # Opens a pull request when an app, the speech service, or education-robot has new commits on main.
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore'
