global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: caddy
    static_configs:
      - targets: ['caddy:2020']

  # Black-box probes: is each service answering, and how fast?
  - job_name: probes
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ['http://web:3000/id']
        labels: { service: web }
      - targets: ['http://robot:3000/id']
        labels: { service: robot }
      - targets: ['http://edu:3000/id']
        labels: { service: edu }
      - targets: ['http://sim:3000/id']
        labels: { service: sim }
      - targets: ['http://kiosk:3000/api/health']
        labels: { service: kiosk }
      - targets: ['http://speech:8000/health']
        labels: { service: speech }
      - targets: ['http://host.docker.internal:11434/api/version']
        labels: { service: ollama }
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
